<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>SBP FieldOps</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SBP FieldOps">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* แอปมือถือ: แถบบนสีกรมท่า + การ์ดบนพื้นเทาอมฟ้า + แถบเมนูล่าง · สีแบรนด์ Navy/Teal · Kanit หัวข้อ, Sarabun เนื้อหา */
:root{--bar:#1B2A4A;--onbar:#fff;--navy:#1B2A4A;--teal:#0F7A7A;--tealink:#0F7A7A;--teal2:#E4F2F2;
--bg:#F3F5F8;--card:#fff;--card2:#F7F9FB;--field:#fff;--paper:#fff;--ink:#1C2333;--muted:#566174;--line:#E1E5ED;--line2:#C5CCD8;
--chip:#ECEFF4;--ph:#E7EBF1;--dash:#9AA6B8;--track:#E6EAF0;--progress:#5FD0C8;--danger:#B3261E;--amberfill:#D08A00;
--red:#B3261E;--redbg:#FDECEA;--redline:#F1B8B3;--amber:#8A5300;--amberbg:#FFF3DC;--amberline:#F0D29C;
--green:#1E6B37;--greenbg:#E5F4EA;--greenline:#B6DFC3;--blue:#1F4E99;--bluebg:#E8EFFB;--blueline:#BFD0F0;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#16223B;--navy:#DCE5F7;--teal:#0F7F7B;--tealink:#5CCBC6;--teal2:#12302F;
--bg:#0E141D;--card:#172131;--card2:#1D2839;--field:#111A27;--ink:#E6EBF3;--muted:#A3AEC0;--line:#2A3647;--line2:#3A475B;
--chip:#253145;--ph:#223044;--dash:#55657C;--track:#263244;
--red:#F49B93;--redbg:#3A1D1D;--redline:#6B2E2B;--amber:#F2C063;--amberbg:#352812;--amberline:#6B5320;
--green:#86D7A0;--greenbg:#15301F;--greenline:#2D5B3B;--blue:#A9C2F3;--bluebg:#18264A;--blueline:#2F4677;color-scheme:dark}}
:root[data-theme="dark"]{--bar:#16223B;--navy:#DCE5F7;--teal:#0F7F7B;--tealink:#5CCBC6;--teal2:#12302F;
--bg:#0E141D;--card:#172131;--card2:#1D2839;--field:#111A27;--ink:#E6EBF3;--muted:#A3AEC0;--line:#2A3647;--line2:#3A475B;
--chip:#253145;--ph:#223044;--dash:#55657C;--track:#263244;
--red:#F49B93;--redbg:#3A1D1D;--redline:#6B2E2B;--amber:#F2C063;--amberbg:#352812;--amberline:#6B5320;
--green:#86D7A0;--greenbg:#15301F;--greenline:#2D5B3B;--blue:#A9C2F3;--bluebg:#18264A;--blueline:#2F4677;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,.kanit{font-family:Kanit,Sarabun,sans-serif;font-weight:500;margin:0;line-height:1.3}
button{font:inherit;cursor:pointer}
a{color:var(--tealink)}
button:focus-visible,a:focus-visible,.chip:focus-visible{outline:2px solid var(--tealink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--onbar);display:flex;align-items:center;gap:6px;padding:8px 10px;min-height:54px}
header.top .title{flex:1;min-width:0;font-family:Kanit,sans-serif;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{display:block;font-family:Sarabun,sans-serif;font-size:12px;opacity:.8}
header.top button{background:transparent;border:0;color:var(--onbar);min-width:44px;min-height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center}
header.top button:active{background:rgba(255,255,255,.12)}
main{max-width:880px;margin:0 auto;padding:12px 16px 100px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.bottom button{flex:1;border:0;background:none;padding:6px 2px 6px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
nav.bottom button.on{color:var(--tealink);font-weight:700}
nav.bottom svg{width:24px;height:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.card.click{cursor:pointer}
.card.click:active{background:var(--card2)}
.card.hl{border-color:var(--tealink);box-shadow:0 0 0 1px var(--tealink) inset}
.sec{margin:18px 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec h2{font-size:16px;color:var(--navy)}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.b{font-weight:700}
.nowrap{white-space:nowrap}
.pre{white-space:pre-wrap}
.right{text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--chip);color:var(--muted);white-space:nowrap;vertical-align:middle}
.badge.red{background:var(--redbg);color:var(--red)}.badge.amber{background:var(--amberbg);color:var(--amber)}
.badge.green{background:var(--greenbg);color:var(--green)}.badge.blue{background:var(--bluebg);color:var(--blue)}.badge.teal{background:var(--teal2);color:var(--tealink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--teal);background:var(--teal);color:#fff;font-weight:700;text-decoration:none;text-align:center}
.btn.ghost{background:var(--card);color:var(--tealink);border-color:var(--tealink)}
.btn.navy{background:var(--bar);border-color:var(--bar);color:var(--onbar)}
.btn.red{background:var(--danger);border-color:var(--danger)}
.btn.redghost{background:var(--card);color:var(--red);border-color:var(--red)}
.btn.sm{min-height:36px;padding:4px 10px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1 1 140px}
label.f{display:block;margin:0 0 10px}
label.f>span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
label.f>span i{color:var(--red);font-style:normal}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--field);color:var(--ink);min-height:44px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--tealink);outline-offset:0;border-color:var(--tealink)}
input[type=checkbox]{width:22px;height:22px;min-height:22px;accent-color:var(--teal);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
@media(max-width:400px){.grid3{grid-template-columns:1fr 1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .v{font-family:Kanit,sans-serif;font-size:22px;color:var(--navy);line-height:1.25}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi.red{border-color:var(--redline);background:var(--redbg)}.kpi.amber{border-color:var(--amberline);background:var(--amberbg)}.kpi.green{border-color:var(--greenline);background:var(--greenbg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px;white-space:nowrap;min-height:38px;color:var(--ink)}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:13px}
table.t .n{text-align:right;white-space:nowrap}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.ph{aspect-ratio:1/1;border-radius:8px;background:var(--ph) center/cover no-repeat;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;cursor:pointer}
.ph.add{border:1px dashed var(--dash);background:var(--card);color:var(--tealink);font-weight:700;font-size:14px;text-align:center;padding:4px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .txt{flex:1;min-width:0}
.check input[type=text]{margin-top:6px;min-height:38px;padding:6px 10px;font-size:15px}
.alert{padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:14px;border:1px solid transparent}
.alert.red{background:var(--redbg);color:var(--red);border-color:var(--redline)}
.alert.amber{background:var(--amberbg);color:var(--amber);border-color:var(--amberline)}
.alert.green{background:var(--greenbg);color:var(--green);border-color:var(--greenline)}
.alert.blue{background:var(--bluebg);color:var(--blue);border-color:var(--blueline)}
.alert.click{cursor:pointer}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px;background:var(--card);border:1px dashed var(--line);border-radius:12px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.track{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:6px}
.fill{height:100%;background:var(--teal);border-radius:99px}
.fill.red{background:var(--danger)}.fill.amber{background:var(--amberfill)}
.money{font-family:Kanit,sans-serif;color:var(--navy)}
.big{font-size:20px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;font-size:15px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.divider{height:1px;background:var(--line);margin:12px 0}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--progress);z-index:60;transition:width .4s ease,opacity .3s}
#bar.on{width:75%}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--bar);color:var(--onbar);border:1px solid var(--line2);padding:10px 16px;border-radius:10px;font-size:15px;max-width:92vw;z-index:70;display:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.err{background:var(--danger);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:580px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.modal h3{font-size:18px;color:var(--navy);margin-bottom:10px}
@media(min-width:640px){.modal-bg{align-items:center}.modal{border-radius:16px}}
.sig{width:100%;height:180px;border:1px dashed var(--dash);border-radius:10px;background:var(--paper);touch-action:none;display:block}
.login{max-width:420px;margin:0 auto;padding:28px 16px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Kanit;font-weight:600;font-size:18px}
.lines .ln{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--card)}
.lines .ln.warn{border-color:var(--amberline);background:var(--amberbg)}
.res{border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:340px;overflow:auto;margin:-4px 0 10px}
.res button{display:block;width:100%;text-align:left;background:var(--card);border:0;border-bottom:1px solid var(--line);padding:9px 12px;min-height:44px;color:var(--ink)}
.res button:last-child{border-bottom:0}
.res button:active{background:var(--teal2)}
.teamcol{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px;margin-bottom:10px}
.doc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;font-size:15px}
.doc h1{font-size:22px;color:var(--navy)}
.doc .co{border-bottom:2px solid var(--navy);padding-bottom:10px;margin-bottom:12px}
.doc table.t td,.doc table.t th{font-size:14px}
.tot{margin-left:auto;max-width:320px}
.tot div{display:flex;justify-content:space-between;padding:3px 0}
.tot .g{font-weight:700;font-size:17px;border-top:2px solid var(--navy);margin-top:4px;padding-top:6px}
.more{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.more button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 10px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--navy);font-weight:600}
.more svg{width:26px;height:26px;color:var(--tealink)}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:19;border-radius:99px;box-shadow:0 6px 16px rgba(15,122,122,.35);padding:10px 18px}
.hide{display:none!important}
.mob{display:none}
@media(max-width:560px){
  table.qlines tr.h{display:none}
  table.qlines,table.qlines tbody{display:block}
  table.qlines tr{display:grid;grid-template-columns:22px 1fr auto;gap:0 8px;border-bottom:1px solid var(--line);padding:6px 0}
  table.qlines td{border:0;padding:1px 0}
  table.qlines td.d{grid-column:2/4}
  table.qlines td.q{grid-column:2;text-align:left;color:var(--muted)}
  table.qlines td.p{display:none}
  table.qlines td.a{grid-column:3;font-weight:700}
  table.qlines .mob{display:inline}
  .doc{padding:14px}.doc .co .right{text-align:left}
}
@media print{header.top,nav.bottom,.noprint,.fab{display:none!important}main{padding:0;max-width:none}body{background:var(--card)}.doc{border:0;padding:0}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="app"><div style="max-width:420px;margin:48px auto;padding:0 16px;font-family:sans-serif;color:#566174;line-height:1.6;text-align:center">กำลังเปิดระบบ SBP FieldOps…<br><small>ถ้าค้างหน้านี้นานเกิน 20 วินาที ให้ปิดแล้วเปิดใหม่ หรือเปิดด้วย Chrome / Safari</small></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<script src="config.js"></script>
<script>
/* เชื่อมหน้าเว็บกับหลังบ้าน (Supabase Edge Function) — ใช้รูปแบบเดียวกับ google.script.run เดิม */
(function () {
  var q = new URLSearchParams(location.search);
  var tok = /^[a-f0-9]{64}$/.test(q.get('quote') || '') ? q.get('quote') : '';
  window.__SBP_BOOT = { mode: tok ? 'quote' : 'app', quoteToken: tok, app: { name: 'SBP FieldOps', version: '2.0.0', tz: 'Asia/Bangkok' } };
  function call(fn, args, ok, fail) {
    var api = (window.SBP_CONFIG && window.SBP_CONFIG.api) || '';
    if (!api) { fail(new Error('ยังไม่ได้ตั้งค่าที่อยู่ระบบ (config.js)')); return; }
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 45000);
    fetch(api, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fn: fn, args: args }), signal: ctl ? ctl.signal : undefined })
      .then(function (r) { return r.json().catch(function () { throw new Error('HTTP ' + r.status); }); })
      .then(function (j) { clearTimeout(timer); if (j && j.ok) ok(j.value); else fail(new Error((j && j.error) || 'ระบบขัดข้อง')); })
      .catch(function (e) { clearTimeout(timer); fail(new Error(e && e.name === 'AbortError' ? 'NetworkError: หมดเวลารอ' : 'NetworkError: ' + ((e && e.message) || 'Failed to fetch'))); });
  }
  function runner(ok, fail) {
    return new Proxy({}, { get: function (_, k) {
      if (k === 'withSuccessHandler') return function (f) { return runner(f, fail); };
      if (k === 'withFailureHandler') return function (f) { return runner(ok, f); };
      return function () { call(String(k), Array.prototype.slice.call(arguments), ok || function () {}, fail || function () {}); };
    } });
  }
  window.google = { script: { run: runner(null, null) } };
})();
</script>
<script>
'use strict';
/* ค่าตั้งต้นของหน้า (สคริปต์เชื่อมระบบด้านบนเติมให้) — ถ้าเปิดไฟล์นี้ตรงๆ จะได้ null แล้วแสดงหน้าอธิบายแทนการพัง */
var BOOT = (function () {
  if (window.__SBP_BOOT) return window.__SBP_BOOT;
  try { var b = JSON.parse(document.getElementById('sbp-boot').textContent); return b && b.app ? b : null; } catch (e) { return null; }
})();
/* กันข้อผิดพลาดที่ไม่ได้ดักไว้ ไม่ให้หน้าค้างหรือขึ้น Uncaught Error — แสดงเป็นข้อความภาษาไทยแทน */
window.addEventListener('error', function (e) {
  if (!e || /ResizeObserver/.test(String(e.message))) return;
  e.preventDefault();
  try { console.warn('SBP error', e.error || e.message); reportProblem(e.error || e.message); } catch (x) { /* ignore */ }
});
window.addEventListener('unhandledrejection', function (e) {
  e.preventDefault();
  try { console.warn('SBP rejection', e.reason); reportProblem(e.reason); } catch (x) { /* ignore */ }
});
function reportProblem(err) {
  var m = (err && err.message) || String(err || '');
  if (typeof toast === 'function') toast('เกิดข้อผิดพลาด: ' + (typeof friendly === 'function' ? friendly(m) : m), true);
}

/* ===================================================== state & storage */
const S = { token: null, user: null, b: null, stack: [], cur: null, seq: 0, photo: {}, job: null, qe: null, sel: {} };
const ST = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
};

/* ===================================================== constants */
const JOB_TYPES = ['ล้าง', 'ติดตั้ง', 'ซ่อม', 'สำรวจ', 'สัญญา/PM', 'งานแก้/ประกัน', 'อื่นๆ'];
const SOURCES = ['โทรเข้า', 'LINE', 'Facebook', 'เว็บไซต์', 'ลูกค้าเก่า', 'ลูกค้าแนะนำ', 'เซลล์หาเอง', 'ช่างพบหน้างาน', 'อื่นๆ'];
const PAYMENTS = ['เงินสด', 'โอนก่อนเข้างาน', 'มัดจำ 50% ส่วนที่เหลือเมื่อเสร็จงาน', 'เครดิต 30 วัน', 'เครดิต 45 วัน', 'เครดิต 60 วัน', 'ตามสัญญา'];

function formData(form) {
  const o = {};
  Array.from(form.elements).forEach(el => {
    if (!el.name || el.disabled) return;
    if (el.type === 'checkbox') o[el.name] = el.checked ? 'Y' : '';
    else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else o[el.name] = el.value.trim();
  });
  return o;
}

function debounce(fn, ms) { let t; return function () { const a = arguments; clearTimeout(t); t = setTimeout(() => fn.apply(null, a), ms); }; }

let busyN = 0;
function busy(d) {
  busyN = Math.max(0, busyN + d);
  const bar = document.getElementById('bar');
  if (busyN) { bar.style.opacity = 1; bar.classList.add('on'); }
  else { bar.style.width = '100%'; setTimeout(() => { bar.classList.remove('on'); bar.style.width = ''; bar.style.opacity = 0; }, 250); }
}
let toastT;
function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = 'none'; }, err ? 5000 : 2600);
}

function copyText(text) {
  return new Promise(resolve => {
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove(); resolve(ok);
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => resolve(true), fallback);
      else fallback();
    } catch (e) { fallback(); }
  });
}

/* ===================================================== server calls */
/** ข้อความผิดพลาดจากเครือข่าย ให้เป็นภาษาคน */
function friendly(msg) {
  msg = String(msg || '');
  if (/NetworkError|HTTP 0|Failed to fetch|network|ERR_|Load failed/i.test(msg)) return 'อินเทอร์เน็ตไม่เสถียร เชื่อมต่อระบบไม่ได้ ลองใหม่อีกครั้ง';
  if (/HTTP 5\d\d/.test(msg)) return 'ระบบขัดข้องชั่วคราว กรุณาลองใหม่อีกครั้ง';
  return msg.replace(/^(Exception|Error):\s*/, '') || 'เกิดข้อผิดพลาด';
}
function gsOnce(fn, args) {
  return new Promise((resolve, reject) => {
    busy(1);
    try {
      if (typeof google === 'undefined' || !google.script) throw new Error('เปิดหน้านี้จากลิงก์ระบบเท่านั้น');
      const r = google.script.run
        .withSuccessHandler(v => { busy(-1); resolve(v); })
        .withFailureHandler(e => { busy(-1); reject(new Error((e && e.message) || String(e) || 'NetworkError')); });
      r[fn].apply(r, args);
    } catch (e) { busy(-1); reject(e); }
  });
}
async function gs(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  const readOnly = fn === 'publicStatus' || fn === 'publicQuote' || (fn === 'api' && /^(home|bootstrap|dashboard|plan\.get)$|\.(list|get|mine|search)$/.test(String(args[1] || '')));
  for (let i = 0; ; i++) {
    try { return await gsOnce(fn, args); }
    catch (e) {
      const net = /NetworkError|HTTP 0|Failed to fetch|network/i.test(e.message);
      if (readOnly && net && i < 2) { await new Promise(r => setTimeout(r, 800 * (i + 1))); continue; }
      throw new Error(friendly(e.message));
    }
  }
}
async function api(action, payload) {
  const r = await gs('api', S.token, action, JSON.parse(JSON.stringify(payload || {})));
  if (!r || !r.ok) {
    if (r && r.code === 'AUTH') { logout(true); const e = new Error('กรุณาเข้าสู่ระบบอีกครั้ง'); e.auth = true; throw e; }
    throw new Error((r && r.error) || 'เกิดข้อผิดพลาด');
  }
  return r.data;
}
async function attempt(fn, okMsg) {
  try { const v = await fn(); if (okMsg) toast(okMsg); return v; }
  catch (e) { if (!e.auth) toast(e.message || String(e), true); return undefined; }
}

/* ===================================================== modal / ask */
function modal(html) {
  const root = document.getElementById('modal-root');
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  root.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  return { el: bg.querySelector('.modal'), close };
}
/** ask({title, text, fields:[{name,label,type,req,options,value,ph}], ok, danger}) → Promise<values|null> */
function ask(o) {
  return new Promise(resolve => {
    const fields = (o.fields || []).map(f => {
      const t = f.type || 'text';
      let el;
      if (t === 'select') el = sel(f.name, f.options, f.value, f.blank);
      else if (t === 'textarea') el = ta(f.name, f.value || '', f.ph);
      else if (t === 'checkbox') return `<label class="row" style="margin-bottom:10px"><input type="checkbox" name="${esc(f.name)}"${f.value ? ' checked' : ''}> <span>${esc(f.label)}</span></label>`;
      else el = inp(f.name, f.value || '', { type: t, ph: f.ph, im: f.im, step: f.step });
      return field(f.label, el, f.req);
    }).join('');
    const m = modal(`<h3>${esc(o.title || 'ยืนยัน')}</h3>${o.text ? `<p class="muted pre" style="margin-top:0">${esc(o.text)}</p>` : ''}${o.html || ''}
      <form data-ask>${fields}<div class="btns"><button type="button" class="btn ghost" data-x>ยกเลิก</button>
      <button type="submit" class="btn ${o.danger ? 'red' : ''}">${esc(o.ok || 'ตกลง')}</button></div></form>`);
    const form = m.el.querySelector('form');
    let done = false;
    const finish = v => { if (done) return; done = true; m.close(); resolve(v); };
    form.addEventListener('submit', e => {
      e.preventDefault(); e.stopPropagation();
      const v = formData(form);
      const miss = (o.fields || []).filter(f => f.req && !v[f.name]);
      if (miss.length) { toast('กรุณากรอก: ' + miss.map(f => f.label).join(', '), true); return; }
      finish(v);
    });
    m.el.querySelector('[data-x]').addEventListener('click', () => finish(null));
    const first = form.querySelector('input,select,textarea');
    if (first && first.type !== 'date') setTimeout(() => first.focus(), 50);
  });
}

/* ===================================================== image helpers */
function resizeImage(file, max, q) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('อ่านไฟล์ไม่ได้'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('ไฟล์นี้ไม่ใช่รูปภาพ'));
      img.onload = () => {
        const r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', q));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function loadPhotos(root) {
  const els = Array.from((root || document).querySelectorAll('.ph[data-pid]'));
  for (const el of els) {
    const id = el.getAttribute('data-pid');
    try {
      if (!S.photo[id]) S.photo[id] = await api('photo.get', { id });
      el.style.backgroundImage = `url("${S.photo[id]}")`;
      el.textContent = '';
    } catch (e) { el.textContent = 'โหลดไม่ได้'; }
  }
}

function go(name, p, o) {
  o = o || {};
  if (o.root) S.stack = [];
  else if (S.cur && !o.replace) S.stack.push(S.cur);
  S.cur = { name, p: p || {} };
  render();
}
function back() { S.cur = S.stack.pop() || { name: homeScreen(), p: {} }; render(); }
const homeScreen = () => (isField() ? 'myjobs' : 'home');

function shell() {
  const nav = NAV[S.user.role] || [];
  const app = document.getElementById('app');
  app.innerHTML = `<header class="top"><button id="hb" aria-label="ย้อนกลับ">${icon('back')}</button>
    <div class="title"><span id="ht"></span><span class="sub" id="hs"></span></div>
    <button data-act="refresh" aria-label="โหลดใหม่">${icon('refresh', 22)}</button></header>
    <main id="main"></main>
    <nav class="bottom">${nav.map(n => `<button data-nav="${n[0]}">${icon(n[2])}<span>${esc(n[1])}</span></button>`).join('')}</nav>`;
  document.getElementById('hb').addEventListener('click', back);
}

async function render() {
  const my = ++S.seq;
  if (!S.user || !S.cur || !document.getElementById('main')) return;
  const sc = SCREENS[S.cur.name] || SCREENS.home;
  const p = S.cur.p;
  const navNames = (NAV[S.user.role] || []).map(n => n[0]);
  document.getElementById('hb').style.visibility = S.stack.length ? 'visible' : 'hidden';
  document.getElementById('ht').textContent = typeof sc.title === 'function' ? sc.title(p) : sc.title;
  document.getElementById('hs').textContent = S.user.name + ' · ' + S.user.role_name + (S.user.team ? ' · ' + S.user.team : '');
  document.querySelectorAll('nav.bottom button').forEach(b => {
    const n = b.getAttribute('data-nav');
    b.classList.toggle('on', n === S.cur.name || (n === 'more' && navNames.indexOf(S.cur.name) < 0 && !S.stack.length));
  });
  const main = document.getElementById('main');
  main.innerHTML = '<div class="loading">กำลังโหลด…</div>';
  window.scrollTo(0, 0);
  try {
    const html = await sc.view(p);
    if (my !== S.seq) return;
    main.innerHTML = html;
    if (sc.mount) sc.mount(p);
    loadPhotos(main);
  } catch (e) {
    if (my !== S.seq || e.auth || !document.getElementById('main')) return;
    main.innerHTML = `<div class="alert red">${esc(e.message || e)}</div><button class="btn ghost block" data-act="refresh">ลองใหม่</button>`;
  }
}

function caseCard(c) {

function contractCard(c) {
  return `<div class="card click" data-go="contractEdit" data-p="${J({ id: c.contract_id, c })}">
    <div class="row between"><div class="b grow">${esc(c.name || c.cust_name)}</div><span class="badge ${c.status === 'ACTIVE' ? 'green' : ''}">${c.status === 'ACTIVE' ? 'ใช้งาน' : 'สิ้นสุด'}</span></div>
    <div class="muted">${esc(c.cust_name)} · ${esc(c.units)} เครื่อง · ${esc(c.visits)} รอบ/สัญญา · <span class="money">${money(c.value)} บ.</span></div>
    <div class="small">รอบบริการถัดไป <b>${esc(thd(c.next_visit))}</b> · วางบิลถัดไป <b>${esc(thd(c.next_bill))}</b> (${esc(c.bill_cycle)}) · หมด ${esc(thd(c.end_date))}</div></div>`;

function alertsBox(list) {
  if (!list || !list.length) return '<div class="alert green">ไม่มีเรื่องค้างที่ต้องตาม</div>';
  return list.map(a => {
    let go = '';
    if (/^J/.test(a.ref)) go = `data-go="job" data-p="${J({ id: a.ref })}"`;
    else if (a.ref === 'plan') go = `data-go="plan"`;
    else if (a.ref === 'approvals') go = `data-go="quotes" data-p="${J({ f: 'PENDING' })}"`;
    else if (/^K/.test(a.ref)) go = `data-go="contracts"`;
    return `<div class="alert ${a.level} ${go ? 'click' : ''}" ${go}>${esc(a.text)}</div>`;
  }).join('');
}

const cpSearch = debounce(async (input) => {
  const box = input.closest('[data-cp]');
  const res = box.querySelector('[data-cpr]');

  if (q.length < 2) { res.classList.add('hide'); return; }
  try {

    res.classList.remove('hide');
  } catch (e) { /* ignore */ }
}, 350);

/* signature pad */
let SIG = null;
function sigInit() {
  const c = document.getElementById('sig');
  if (!c) { SIG = null; return; }
  const dpr = window.devicePixelRatio || 1;
  const r = c.getBoundingClientRect();
  c.width = Math.max(1, Math.round(r.width * dpr)); c.height = Math.max(1, Math.round(r.height * dpr));
  const ctx = c.getContext('2d');
  ctx.scale(dpr, dpr); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, r.width, r.height);
  SIG = { c, ctx, dirty: false, down: false };
  if (c.dataset.init) return;
  c.dataset.init = '1';
  const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.addEventListener('pointerdown', e => { e.preventDefault(); try { c.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } SIG.down = true; const p = pos(e); SIG.ctx.beginPath(); SIG.ctx.moveTo(p[0], p[1]); });
  c.addEventListener('pointermove', e => { if (!SIG.down) return; e.preventDefault(); const p = pos(e); SIG.ctx.lineTo(p[0], p[1]); SIG.ctx.stroke(); SIG.dirty = true; });
  const up = () => { SIG.down = false; };
  c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up); c.addEventListener('pointerleave', up);
}

function collectJob() {
  const checklist = S.job.checklist.map((c, i) => ({
    t: c.t, d: !!(document.querySelector(`[data-ci="${i}"]`) || {}).checked,
    n: ((document.querySelector(`[data-cn="${i}"]`) || {}).value || '').trim()
  }));
  const measures = {};
  document.querySelectorAll('[data-m]').forEach(el => { if (el.value.trim()) measures[el.getAttribute('data-m')] = el.value.trim(); });
  const materials = Array.from(document.querySelectorAll('[data-mat]')).map(r => ({
    name: r.querySelector('[data-k=name]').value.trim(), qty: r.querySelector('[data-k=qty]').value.trim(), unit: r.querySelector('[data-k=unit]').value.trim()
  })).filter(m => m.name);
  const ex = document.getElementById('extra'), tn = document.getElementById('tnote');
  return { job_id: S.job.job_id, checklist, measures, materials, extra_found: ex ? ex.value : undefined, tech_note: tn ? tn.value : undefined };
}

    h += sec('งาน (' + d.jobs.length + ')') + (d.jobs.length ? d.jobs.slice(0, 15).map(j => jobCard(j)).join('') : empty('ยังไม่มีงาน'));

    if (d.cases.length) h += sec('เคสประกัน/งานแก้') + d.cases.map(caseCard).join('');

};

    ${!l.item_id ? `<div class="grid2">${field('ทีม-วันต่อหน่วย (เช่น 0.5 = ครึ่งวัน)', `<input data-lf="team_day" value="${esc(l.team_day || '')}" type="number" inputmode="decimal" min="0" step="any">`)}

    <div class="row between small"><span>${warn ? '<span class="badge red">ต่ำกว่าราคาโครงการ → ต้อง CEO อนุมัติ</span>' : l.manual && l.cat && Math.abs(Number(l.price) - qeLinePrice(l, lv)) > 0.001 ? '<span class="badge amber">ราคาแก้เอง</span>' : ''}</span>
    <span class="b">${money(Number(l.qty || 0) * Number(l.price || 0), 1)} บ.</span></div></div>`;
}
function qeTotals() {
  const q = S.qe; if (!q) return;
  const sub = q.lines.reduce((s, l) => s + Number(l.qty || 0) * Number(l.price || 0), 0);
  const disc = Number(q.discount || 0), net = sub - disc;
  const vr = Number(S.b.settings.vat_rate || 0.07);
  const st = S.b.settings;
  const min = q.job_type === 'ซ่อม' ? Number(st.min_bill_repair || 0) : q.cust_type === 'B2C' ? Number(st.min_bill_b2c || 0) : Number(st.min_bill_b2b || 0);
  const td = q.lines.reduce((s, l) => s + Number(l.qty || 0) * Number(l.cat ? l.cat.team_day : l.team_day || 0), 0);
  const el = document.getElementById('qetot');
  if (el) el.innerHTML = `<div class="tot" style="max-width:none"><div><span>รวม</span><span>${money(sub, 1)}</span></div><div><span>หลังส่วนลด</span><span class="b">${money(net, 1)}</span></div>
    <div><span>VAT</span><span>${money(net * vr, 1)}</span></div><div class="g"><span>รวมทั้งสิ้น</span><span>${money(net * (1 + vr), 1)}</span></div>
    <div class="small"><span>Minimum Bill ${money(min)}</span>${net >= min ? '<span class="badge green">ผ่าน</span>' : '<span class="badge red">ต่ำกว่า</span>'}</div>
    <div class="small"><span>ใช้ทีม-วันประมาณ</span><span>${td.toFixed(2)}</span></div></div>`;
}
function qeSync() {
  const f = document.querySelector('form[data-form="qe"]'); if (!f) return;
  const v = formData(f);
  ['cust_id', 'cust_name', 'cust_type', 'site', 'contact', 'phone', 'job_type', 'payment', 'scope_note', 'exclusions'].forEach(k => { if (v[k] !== undefined) S.qe[k] = v[k]; });
  S.qe.discount = Number(v.discount || 0);
  document.querySelectorAll('[data-li]').forEach(row => {
    const l = S.qe.lines[Number(row.getAttribute('data-li'))]; if (!l) return;
    row.querySelectorAll('[data-lf]').forEach(inp => {
      const k = inp.getAttribute('data-lf');
      if (k === 'description' || k === 'unit') l[k] = inp.value;
      else if (k === 'cost') l.cost = inp.value === '' ? undefined : Number(inp.value);
      else {
        const n = Number(inp.value || 0);
        if (k === 'price' && l.cat && Math.abs(n - Number(l.price)) > 0.001) l.manual = true;
        l[k] = n;
      }
    });
  });
}
function qeRedrawLines() {
  const box = document.getElementById('qelines');
  box.innerHTML = S.qe.lines.map(qeLineHtml).join('') || empty('ยังไม่มีรายการ');
  box.previousElementSibling.querySelector('h2').textContent = 'รายการ (' + S.qe.lines.length + ')';
  qeTotals();
}
const qeSearch = debounce(async () => {

const FORMS = {
  async pin(f) {
    const v = formData(f);
    if (!/^\d{6}$/.test(v.new_pin || '')) { toast('PIN ใหม่ต้องเป็นตัวเลข 6 หลัก', true); return; }
    if (v.new_pin !== v.new_pin2) { toast('PIN ใหม่ไม่ตรงกัน', true); return; }
    const r = await attempt(() => api('me.pin', { old_pin: v.old_pin, new_pin: v.new_pin }), 'เปลี่ยน PIN แล้ว (เครื่องอื่นต้องเข้าระบบใหม่)');
    if (r && r.token) { S.token = r.token; ST.set('sbp_token', r.token); f.reset(); }
  },
  search(f) { const v = formData(f); const p = JSON.parse(f.getAttribute('data-p') || '{}'); p.q = v.q; go(f.getAttribute('data-screen'), p, { replace: true }); },
  async lead(f) {
    const v = formData(f);
    const answers = {};
    QUESTIONS.forEach(q => { answers[q[0]] = v['a_' + q[0]]; });
    answers.risk = v.a_risk; answers.unknown = v.a_unknown;
    const p = { lead_id: f.getAttribute('data-id') || undefined, cust_id: v.cust_id, cust_name: v.cust_name, cust_type: v.cust_type, site: v.site, zone: v.zone, contact: v.contact, phone: v.phone,
      source: v.source, job_type: v.job_type, units: Number(v.units || 0), est_value: Number(v.est_value || 0), answers, next_action: v.next_action, next_date: v.next_date, note: v.note };
    const r = await attempt(() => api('leads.save', p), 'บันทึก Lead แล้ว');

    v.credit_days = Number(v.credit_days || 0);

    if (r) go('customer', { id: r.cust_id }, { replace: true });
  },
  async qe() {
    qeSync();
    const q = S.qe;
    if (!q.lines.length) { toast('ยังไม่มีรายการ', true); return; }
    const bad = q.lines.find(l => !l.item_id && (!l.description || !Number(l.price)));
    if (bad) { toast('รายการพิมพ์เองต้องมีรายละเอียดและราคา', true); return; }
    const p = { quote_id: q.quote_id || undefined, lead_id: q.lead_id, cust_id: q.cust_id, cust_name: q.cust_name, cust_type: q.cust_type, site: q.site, contact: q.contact, phone: q.phone,
      job_type: q.job_type, payment: q.payment, price_level: q.price_level, discount: q.discount, scope_note: q.scope_note, exclusions: q.exclusions,
      lines: q.lines.map(l => ({ item_id: l.item_id, description: l.description, qty: Number(l.qty || 0), unit: l.unit, price: Number(l.price || 0), team_day: Number(l.team_day || 0), cost: l.cost })) };
    const r = await attempt(() => api('quotes.save', p), 'บันทึกแล้ว — ตรวจด่านแล้วกดส่งขออนุมัติ');
    if (r) go('quote', { id: r.quote_id }, { replace: true });
  },
  async assign(f) {
    const v = formData(f);
    if (await attempt(() => api('plan.assign', { job_id: f.getAttribute('data-id'), team: v.team, date: S.plan.date, time: v.time, seq: Number(v.seq || 1) }), 'จัดทีมแล้ว') !== undefined) render();
  },
  async caseDecide(f) {
    const v = formData(f);
    if (!v.class || !v.decision) { toast('เลือกสาเหตุและคำตัดสิน', true); return; }
    v.case_id = S.case.case_id; v.amount = Number(v.amount || 0);
    const r = await attempt(() => api('cases.decide', v), 'บันทึกคำตัดสินแล้ว' + (v.create_job ? ' — เปิดงานแก้รอจัดทีม' : ''));
    if (r) go('case', { id: r.case.case_id, c: r.case }, { replace: true });
  },
  async caseClose(f) {
    const v = formData(f);
    const r = await attempt(() => api('cases.close', { case_id: S.case.case_id, cost: Number(v.cost || 0), root_cause: v.root_cause }), 'ปิดเคสแล้ว');
    if (r) go('case', { id: r.case_id, c: r }, { replace: true });
  },
  async contract(f) {
    const v = formData(f);
    if (!v.cust_id) { toast('เลือกลูกค้าจากรายการค้นหา (สัญญาต้องผูกกับลูกค้าในระบบ)', true); return; }
    if (f.getAttribute('data-id')) v.contract_id = f.getAttribute('data-id');
    ['value', 'units', 'visits', 'interval_months'].forEach(k => { v[k] = Number(v[k] || 0); });
    const r = await attempt(() => api('contracts.save', v), 'บันทึกสัญญาแล้ว');
    if (r) go('contracts', {}, { replace: true });
  },
  async settings(f) {
    const v = formData(f);
    SETTING_FIELDS.forEach(s => { if (s[2]) v[s[0]] = Number(v[s[0]] || 0); });
    const r = await attempt(() => api('settings.save', v), 'บันทึกการตั้งค่าแล้ว');
    if (r) { S.b = await api('bootstrap'); render(); }
  }
};

/* ===================================================== global events */
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { go(nav.getAttribute('data-nav'), {}, { root: true }); return; }
  const g = e.target.closest('[data-go]');
  if (g) {
    e.preventDefault();
    const p = g.getAttribute('data-p') ? JSON.parse(g.getAttribute('data-p')) : {};
    go(g.getAttribute('data-go'), p, { replace: g.hasAttribute('data-replace') });
    return;
  }
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.getAttribute('data-act')]) { e.preventDefault(); ACT[a.getAttribute('data-act')](a); }
});
/* ฟอร์มทำงานได้แม้หน้าเว็บถูกฝังแบบห้ามส่งฟอร์ม (sandbox ไม่มี allow-forms): ดักปุ่มบันทึกแล้วส่งเหตุการณ์ submit เอง */
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button[type=submit], input[type=submit]');
  if (!b || !b.form) return;
  e.preventDefault();
  const f = b.form;
  if (f.checkValidity && !f.checkValidity()) { if (f.reportValidity) f.reportValidity(); return; }
  f.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
}, true);
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.hasAttribute('data-ask')) return;
  e.preventDefault();
  const n = f.getAttribute('data-form');
  if (FORMS[n]) FORMS[n](f);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.hasAttribute && t.hasAttribute('data-cpq')) {
    const box = t.closest('[data-cp]');
    box.querySelector('[name=cust_id]').value = '';
    box.querySelector('[data-cpi]').textContent = t.value.trim() ? 'ลูกค้าใหม่ (ระบบจะสร้างให้) — หรือเลือกจากรายการด้านบน' : '';
    cpSearch(t);
  }
  if (t.id === 'qeq') qeSearch();
  if (S.qe && t.closest && t.closest('form[data-form="qe"]') && t.id !== 'qeq') {
    qeSync();
    if (t.hasAttribute('data-lf')) {
      const row = t.closest('[data-li]');
      const l = S.qe.lines[Number(row.getAttribute('data-li'))];
      const amt = row.querySelector('.row.between.small .b');
      if (amt && l) amt.textContent = money(Number(l.qty || 0) * Number(l.price || 0), 1) + ' บ.';
    }
    qeTotals();
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'plandate') { go('plan', { date: t.value }, { replace: true }); return; }
  if (t.id === 'dashmonth') { go('dashboard', { month: t.value }, { replace: true }); return; }
  if (t.id === 'qecat') { qeSearch(); return; }
  if (S.qe && t.name === 'price_level' && t.closest('form[data-form="qe"]')) {
    qeSync();
    S.qe.price_level = t.value;
    const manual = S.qe.lines.filter(l => l.cat && l.manual);
    let resetManual = false;
    if (manual.length) resetManual = await confirmBox('ปรับราคาที่แก้เองด้วย?', manual.length + ' บรรทัดมีราคาที่แก้เอง — ปรับเป็นราคาตามระดับใหม่หรือไม่', 'ปรับทั้งหมด');
    S.qe.lines.forEach(l => { if (l.cat && (!l.manual || resetManual)) { l.price = qeLinePrice(l, t.value); l.manual = false; } });
    qeRedrawLines();
    return;
  }
  if (S.qe && (t.name === 'cust_type' || t.name === 'job_type') && t.closest('form[data-form="qe"]')) { qeSync(); qeTotals(); return; }
  if (t.hasAttribute && t.hasAttribute('data-upload')) {
    const kind = t.getAttribute('data-upload');
    const files = Array.from(t.files || []);
    t.value = '';
    for (let i = 0; i < files.length; i++) {
      try {
        toast('กำลังอัปโหลดรูป ' + (i + 1) + '/' + files.length);
        const data = await resizeImage(files[i], BOOT.demo ? 900 : 1280, BOOT.demo ? 0.6 : 0.72);
        if (kind === 'lead') await api('leads.photo', { lead_id: S.lead.lead_id, data });
        else {
          if (i === 0) await api('jobs.save', collectJob()).catch(() => {});
          await api('jobs.photo', { job_id: S.job.job_id, kind, data });
        }
      } catch (err) { toast(err.message, true); return; }
    }
    toast('อัปโหลดแล้ว ' + files.length + ' รูป');
    render();
  }
});

/* ===================================================== login / boot */
function logout(expired) {
  S.token = null; ST.del('sbp_token');
  if (expired) toast('กรุณาเข้าสู่ระบบอีกครั้ง');
  showLogin();
}
const loginShell = inner => `<div class="login"><div class="brand"><div class="logo">SBP</div><div><h1 style="font-size:22px;color:var(--navy)">SBP FieldOps</h1><div class="muted">ระบบงานบริการแอร์ · สหบูรพากรุ๊ป</div></div></div>${inner}</div>`;
function afterLogin(r) {
  S.token = r.data.token; S.user = r.data.user;
  ST.set('sbp_token', S.token); ST.set('sbp_user', JSON.stringify(S.user));
  if ((r.data.first || r.data.recovery_used) && ['CEO', 'MANAGER'].indexOf(S.user.role) >= 0) S.afterLogin = 'me';
  start();
}
async function showLogin(step, ctx) {
  const app = document.getElementById('app');
  ctx = ctx || {};
  if (!S.status || step === undefined) {
    app.innerHTML = loginShell('<div class="card"><div class="loading">กำลังเชื่อมต่อระบบ…</div></div>');
    try { const r = await gs('publicStatus'); if (!r.ok) throw new Error(r.error); S.status = r.data; }
    catch (e) {
      app.innerHTML = loginShell(`<div class="alert red">เชื่อมต่อระบบไม่ได้: ${esc(e.message)}</div><button class="btn block" id="retry">ลองใหม่</button>`);
      document.getElementById('retry').addEventListener('click', () => showLogin());
      return;
    }
    step = S.status.initialized ? 'phone' : 'setup';
  }
  const phone0 = ctx.phone || ST.get('sbp_phone') || '';
  const telInput = `<input name="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="08x-xxx-xxxx" value="${esc(phone0)}" required>`;
  const bind = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', e => { e.preventDefault(); fn(); }); };
  const onSubmit = fn => document.getElementById('lf').addEventListener('submit', async e => {
    e.preventDefault(); e.stopPropagation();
    const btn = e.target.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
    try { await fn(formData(e.target)); } catch (err) { toast(err.message, true); } finally { if (btn) btn.disabled = false; }
  }, true);

  if (step === 'setup') {
    app.innerHTML = loginShell(`<div class="alert amber"><b>ตั้งค่าระบบครั้งแรก</b><br>ใส่รหัสตั้งค่าครั้งแรก 8 หลัก (เจ้าของระบบดูได้จากเมนู SBP FieldOps ในไฟล์ฐานข้อมูล) และเบอร์มือถือของ CEO — ใช้ได้ครั้งเดียว จากนั้นตั้ง PIN ของคุณ</div>
      <form id="lf" class="card">${field('รหัสตั้งค่าครั้งแรก', '<input name="code" inputmode="numeric" autocomplete="off" maxlength="12" required>', true)}
      ${field('เบอร์มือถือ CEO (ใช้เข้าระบบ)', telInput, true)}
      <button class="btn block" type="submit">ตั้งค่าและเข้าสู่ระบบ</button></form>`);
    onSubmit(async v => {
      const r = await gs('setupInit', v.code, v.phone);
      if (!r.ok) { toast(r.error, true); return; }
      ST.set('sbp_phone', v.phone); afterLogin(r);
    });
    return;
  }
  if (step === 'phone') {
    const sms = S.status.sms;
    app.innerHTML = loginShell(`<form id="lf" class="card">${field('เบอร์มือถือ', telInput)}
      ${field('PIN 6 หลัก', '<input name="pin" type="password" inputmode="numeric" autocomplete="current-password" pattern="\\d{6}" maxlength="6" required style="letter-spacing:4px">')}
      <button class="btn block" type="submit">เข้าสู่ระบบ</button>
      <button class="btn ghost block" style="margin-top:8px" id="havecode" type="button">ครั้งแรก / ลืม PIN — ใช้รหัสจากผู้จัดการ</button>
      ${sms ? '<button class="btn ghost block" style="margin-top:8px" id="smscode" type="button">ลืม PIN — ขอรหัสทาง SMS</button>' : ''}</form>
      <div class="muted small" style="text-align:center;margin-top:12px">ยังไม่มีบัญชี หรือเปลี่ยนเบอร์ ให้แจ้งผู้จัดการ<br><a href="#" id="rcv">CEO / ผู้จัดการ: เข้าระบบด้วยรหัสกู้คืน</a></div>`);
    const phoneOf = () => String(formData(document.getElementById('lf')).phone || '').trim();
    onSubmit(async v => {
      const ph = String(v.phone || '').trim();
      ST.set('sbp_phone', ph);
      const r = await gs('pinLogin', ph, v.pin);
      if (!r.ok) { toast(r.error, true); if (r.code === 'NOPIN') showLogin('code', { phone: ph }); return; }
      afterLogin(r);
    });
    bind('havecode', () => { const ph = phoneOf(); if (ph.replace(/\D/g, '').length < 9) { toast('กรอกเบอร์มือถือก่อน', true); return; } ST.set('sbp_phone', ph); showLogin('code', { phone: ph }); });
    bind('smscode', async () => {
      const ph = phoneOf(); if (ph.replace(/\D/g, '').length < 9) { toast('กรอกเบอร์มือถือก่อน', true); return; }
      const r = await gs('otpRequest', ph).catch(e => ({ ok: false, error: e.message }));
      if (!r.ok) { toast(r.error, true); return; }
      toast('ส่งรหัสไปที่ ' + r.data.masked + ' แล้ว');
      showLogin('code', { phone: ph, ref: r.data.ref, masked: r.data.masked });
    });
    bind('rcv', () => showLogin('recovery', { phone: phoneOf() }));
    return;
  }
  if (step === 'code') {
    app.innerHTML = loginShell(`<form id="lf" class="card"><div class="muted small" style="margin-bottom:8px">${ctx.ref ? `ส่งรหัสทาง SMS ไปที่ <b>${esc(ctx.masked)}</b> แล้ว · Ref <b>${esc(ctx.ref)}</b> (ใช้ได้ 5 นาที)` : `เบอร์ <b>${esc(ctx.phone)}</b> · ใส่รหัสเข้าใช้ 6 หลักที่ได้จากผู้จัดการ`}</div>
      ${field('รหัส 6 หลัก', '<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="\\d{6}" maxlength="6" required style="font-size:24px;letter-spacing:6px;text-align:center">')}
      <button class="btn block" type="submit">เข้าสู่ระบบ</button>
      <div class="row between" style="margin-top:10px"><a href="#" id="chg">กลับ</a>${S.status.sms && ctx.ref ? '<a href="#" id="again">ขอรหัสใหม่</a>' : ''}</div></form>`);
    const ci = app.querySelector('input[name=code]'); if (ci) ci.focus();
    onSubmit(async v => {
      const r = await gs('otpVerify', ctx.phone, v.code);
      if (!r.ok) { toast(r.error, true); return; }
      afterLogin(r);
    });
    bind('chg', () => showLogin('phone', { phone: ctx.phone }));
    bind('again', async () => {
      const r = await gs('otpRequest', ctx.phone).catch(e => ({ ok: false, error: e.message }));
      if (!r.ok) { toast(r.error, true); return; }
      toast('ส่งรหัสใหม่แล้ว');
      showLogin('code', { phone: ctx.phone, ref: r.data.ref, masked: r.data.masked });
    });
    return;
  }
  if (step === 'recovery') {
    app.innerHTML = loginShell(`<div class="alert amber small">สำหรับ CEO / ผู้จัดการ เมื่อ SMS ใช้ไม่ได้ — รหัสกู้คืนใช้ได้ครั้งเดียว เข้าระบบแล้วให้สร้างรหัสใหม่</div>
      <form id="lf" class="card">${field('เบอร์มือถือ', telInput)}${field('รหัสกู้คืน 10 หลัก', '<input name="code" inputmode="numeric" autocomplete="off" maxlength="12" required>')}
      <button class="btn block" type="submit">เข้าสู่ระบบ</button><div style="margin-top:10px"><a href="#" id="back">กลับ</a></div></form>`);
    onSubmit(async v => {
      const r = await gs('recoveryLogin', v.phone, v.code);
      if (!r.ok) { toast(r.error, true); return; }
      ST.set('sbp_phone', v.phone); afterLogin(r);
    });
    bind('back', () => showLogin('phone', { phone: ctx.phone }));
  }
}
function setPinScreen() {
  const app = document.getElementById('app');
  app.innerHTML = loginShell(`<div class="alert amber">ตั้ง <b>PIN 6 หลัก</b> ของคุณเอง ใช้คู่กับเบอร์มือถือทุกครั้งที่เข้าระบบ — ห้ามใช้เลขซ้ำ เลขเรียง หรือเลขจากเบอร์โทร และห้ามบอกใคร</div>
    <form id="lf" class="card">${field('PIN ใหม่ 6 หลัก', '<input name="new_pin" type="password" inputmode="numeric" autocomplete="new-password" pattern="\\d{6}" maxlength="6" required style="letter-spacing:4px">')}
    ${field('ยืนยัน PIN อีกครั้ง', '<input name="new_pin2" type="password" inputmode="numeric" autocomplete="new-password" maxlength="6" required style="letter-spacing:4px">')}
    <button class="btn block" type="submit">บันทึก PIN และเข้าใช้งาน</button></form>`);
  document.getElementById('lf').addEventListener('submit', async e => {
    e.preventDefault(); e.stopPropagation();
    const v = formData(e.target);
    if (!/^\d{6}$/.test(v.new_pin || '')) { toast('PIN ต้องเป็นตัวเลข 6 หลัก', true); return; }
    if (v.new_pin !== v.new_pin2) { toast('PIN สองช่องไม่ตรงกัน', true); return; }
    const r = await attempt(() => api('me.pin', { new_pin: v.new_pin }), 'ตั้ง PIN แล้ว');
    if (r && r.token) {
      S.token = r.token; S.user = r.user; ST.set('sbp_token', r.token); ST.set('sbp_user', JSON.stringify(r.user));
      start();
    }
  }, true);
}
async function start() {
  if (S.user && S.user.must_change) { try { S.b = await api('bootstrap'); S.user = S.b.user; } catch (e) { if (e.auth) return; } if (S.user.must_change) { setPinScreen(); return; } }
  try {
    S.b = await api('bootstrap');
    S.user = S.b.user;
    ST.set('sbp_user', JSON.stringify(S.user));
    if (S.user.must_change) { setPinScreen(); return; }
    shell();
    S.stack = []; S.cur = null;
    go(homeScreen(), {}, { root: true });
    if (S.afterLogin === 'me') {
      S.afterLogin = '';
      if (!S.user.has_recovery) { go('me', {}); toast('สร้างรหัสกู้คืนไว้ใช้วันที่ SMS ไม่เข้า'); }
    }
  } catch (e) {
    if (e.auth || !S.token) return;
    document.getElementById('app').innerHTML = `<div class="login"><div class="brand"><div class="logo">SBP</div><h1 style="font-size:20px;color:var(--navy)">SBP FieldOps</h1></div>
      <div class="alert red">${esc(e.message)}</div><button class="btn block" id="retry">ลองใหม่</button>
      <button class="btn ghost block" style="margin-top:8px" id="relogin">เข้าสู่ระบบด้วยเบอร์อื่น</button></div>`;
    document.getElementById('retry').addEventListener('click', start);
    document.getElementById('relogin').addEventListener('click', () => logout(false));
  }
}

        ${field('หมายเหตุ เช่น วันที่สะดวก เลข PO (ถ้ามี)', '<textarea name="note" maxlength="200"></textarea>')}
        <button class="btn block" type="submit">ยืนยันสั่งงาน</button><div class="muted small" style="margin-top:6px">การยืนยันนี้แจ้งให้เจ้าหน้าที่ติดต่อนัดหมาย ค่าใช้จ่ายส่วนเพิ่ม (ถ้ามี) จะแจ้งให้ยืนยันก่อนดำเนินงานทุกครั้ง</div></form>`
        : v.status === 'ACCEPTED' || v.customer_ack ? '<div class="alert green">ได้รับการยืนยันแล้ว ขอบคุณครับ เจ้าหน้าที่จะติดต่อนัดหมายวันเข้างาน</div>'
        : '<div class="alert amber">ใบเสนอราคานี้ไม่อยู่ในสถานะให้ยืนยันออนไลน์ (อาจหมดอายุหรือมีฉบับใหม่) กรุณาติดต่อเจ้าหน้าที่</div>'}
      ${BOOT.demo ? '<button class="btn ghost block" style="margin-top:8px" id="demoback">กลับเข้าระบบ (โหมดทดลอง)</button>' : '<button class="btn ghost block" style="margin-top:8px" id="printq">พิมพ์ / บันทึก PDF</button>'}</div></main>`;
    const pq = document.getElementById('printq');
    if (pq) pq.addEventListener('click', () => window.print());
    const bk = document.getElementById('demoback');
    if (bk) bk.addEventListener('click', () => { BOOT.mode = 'app'; BOOT.quoteToken = ''; try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ } if (S.token) start(); else showLogin(); });
    const f = document.getElementById('ackf');
    if (f) f.addEventListener('submit', async e => {
      e.preventDefault(); e.stopPropagation();
      const v2 = formData(f);
      if (!v2.name) { toast('กรุณาระบุชื่อผู้ยืนยัน', true); return; }
      try {
        const rr = await gs('publicAck', BOOT.quoteToken, v2.name, v2.note);
        if (!rr.ok) { toast(rr.error, true); return; }
        draw(rr.data); toast('ยืนยันเรียบร้อย ขอบคุณครับ');
      } catch (err) { toast(err.message, true); }
    }, true);
  };
  draw(r.data);
}

function standaloneHelp() {
  document.getElementById('app').innerHTML = loginShell('<div class="alert red">เปิดหน้านี้จากลิงก์ระบบเท่านั้น</div>');
}

(function init() {
  if (!BOOT || typeof google === 'undefined' || !google.script) { standaloneHelp(); return; }
  if (BOOT.mode === 'quote') { publicQuotePage(); return; }
  S.token = ST.get('sbp_token');
  try { S.user = JSON.parse(ST.get('sbp_user') || 'null'); } catch (e) { S.user = null; }
  if (S.token && S.user) start();
  else showLogin();
})();
</script>
</body>
</html>
